version: '3.8'

services:
  postgres-test:
    image: postgres:15
    environment:
      POSTGRES_USER: nhidb
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nhidb_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhidb -d nhidb_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
