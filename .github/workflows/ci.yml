name: CI Pipeline
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start Services
        run: docker compose up -d postgres opa
      - name: Install Dependencies
        working-directory: registry-api
        run: npm ci
      - name: Wait for Services
        run: |
          for i in {1..30}; do
            if docker compose exec postgres pg_isready -U postgres; then
              echo "Postgres is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Postgres failed to start"
              docker compose logs postgres
              exit 1
            fi
            sleep 2
          done
          for i in {1..30}; do
            if curl -s http://localhost:8181/health > /dev/null; then
              echo "OPA is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "OPA failed to start"
              docker compose logs opa
              exit 1
            fi
            sleep 2
          done
      - name: Run Tests
        working-directory: registry-api
        env:
          POSTGRES_PASSWORD: postgrespassword
        run: npm test
      - name: Stop Services
        if: always()
        run: docker compose down
