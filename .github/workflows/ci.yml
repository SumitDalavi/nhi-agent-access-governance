name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  node-build-test:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Dependencies
        run: npm install
  opa-test:
    name: OPA Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA
        run: curl -L -o opa https://openpolicyagent.org/downloads/v0.65.0/opa_linux_amd64_static
          && chmod +x opa && sudo mv opa /usr/local/bin/
      - name: OPA Check
        run: opa check policies/
      - name: OPA Test
        run: opa test policies/ -v
