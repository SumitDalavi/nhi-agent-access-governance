name: CI Pipeline
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
jobs:
  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start Services
        run: docker compose up -d postgres opa
      - name: Install Dependencies
        working-directory: registry-api
        run: npm ci
      - name: Wait for Services
        run: |
          sleep 10
      - name: Run Tests
        working-directory: registry-api
        run: npm test
      - name: Stop Services
        run: docker compose down
